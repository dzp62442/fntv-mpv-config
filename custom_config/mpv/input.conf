# MPV播放器输入配置
# 这个文件定义了MPV的快捷键映射

# 基本播放控制
SPACE cycle pause                          # 空格键暂停/播放
q quit                                     # q键退出
f cycle fullscreen                         # f键全屏切换
m cycle mute                               # m键静音切换

# 音量控制
9 add volume -2                            # 9键降低音量
0 add volume 2                             # 0键增加音量

# 播放速度控制
[ multiply speed 1/1.1                     # [键减慢播放速度
] multiply speed 1.1                       # ]键加快播放速度

# 字幕控制
v cycle sub-visibility                     # v键切换字幕显示
b cycle sub                                # b键切换字幕轨道

# 快进快退
LEFT seek -10                              # 左箭头快退10秒
RIGHT seek 10                              # 右箭头快进10秒
DOWN seek -60                              # 下箭头快退1分钟
UP seek 60                                 # 上箭头快进1分钟

# uosc界面控制
tab script-binding uosc/toggle-ui          # Tab键切换uosc界面
ctrl+` script-binding uosc/open-file       # Ctrl+`打开文件
