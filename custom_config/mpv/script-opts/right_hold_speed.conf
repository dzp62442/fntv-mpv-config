# Keyboard key handled by the script.
key=RIGHT

# Tap behavior: seek forward by this many seconds.
seek_seconds=5

# Long-press threshold in seconds. Lower is more responsive.
hold_delay=0.16

# Long-press playback speed. Set to 3.0 for 3x.
speed=2.0

# Smoothly ramp speed up/down instead of switching instantly.
ramp=yes
ramp_step=0.1
ramp_interval=0.03
restore_step=0.35
restore_interval=0.02

# Show brief OSD hints for seek/speed changes.
show_osd=yes

# Keep showing speed while the right arrow key is held.
hold_osd_interval=0.3
hold_osd_duration=0.6
