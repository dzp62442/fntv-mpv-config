# uosc_danmaku 弹幕插件配置文件

# 弹幕显示区域 (0.0-1.0)
danmaku_area=0.7

# 弹幕透明度 (0.0-1.0)
danmaku_alpha=0.8

# 弹幕字体大小
danmaku_fontsize=25

# 弹幕滚动速度
danmaku_speed=5

# 是否启用弹幕
danmaku_enable=yes

# 弹幕过滤等级
danmaku_filter_level=0

# 弹幕最大行数
danmaku_max_lines=12

# 弹幕颜色模式
danmaku_color_mode=normal

# 自动搜索弹幕
auto_search=yes

# 搜索API偏好
search_api=dandanplay
