# uosc配置文件
# 控制uosc界面的外观和行为

# 界面主题
ui_scale=1.0
ui_scale_fullscreen=1.2

# 进度条设置
timeline_opacity=0.8
timeline_width_fullscreen=3
timeline_width_windowed=2

# 控制栏设置
controls=menu,gap,subtitles,<audio,<video,<speed,space,play_pause,space,speed>,volume>,gap,<seek_backward,seek_forward>,gap,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,fullscreen
controls_size=32
controls_margin=8
controls_spacing=2

# 顶部栏设置
top_bar=never
top_bar_controls=menu,gap,subtitles,audio,video,<speed,gap,space,seek_backward,seek_forward,space,gap,speed>,gap,volume,gap,fullscreen

# 窗口控制按钮
window_controls=auto
window_controls_size=24

# 菜单设置
menu_item_height=36
menu_wasd_navigation=yes
menu_hjkl_navigation=yes

# 字体设置
font_bold=yes
font_border=1.2

# 颜色主题 (dark)
color_foreground=ffffff
color_foreground_text=000000
color_background=000000
color_background_text=ffffff

# 进度条颜色
progress_size=2
progress_line_width=20
