name: Daily MPV Package Build

on:
  schedule:
    # 每天早上8点（UTC）运行，即北京时间下午4点
    - cron: '0 8 * * *'
  # 允许手动触发
  workflow_dispatch:
  # 推送到release分支时也触发
  push:
    branches: [ release, master ]
  pull_request:
    branches: [ release, master ]

jobs:
  build:
    runs-on: windows-latest
    
    # 为GITHUB_TOKEN添加必要权限
    permissions:
      contents: write        # 需要写入权限来创建release
      actions: read         # 读取actions权限
      checks: read          # 读取checks权限
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install 7-Zip
      run: |
        # 安装7-Zip
        choco install 7zip -y
        # 验证安装
        7z --help
        # 或者使用winget
        # winget install --id 7zip.7zip --silent --accept-package-agreements --accept-source-agreements
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: |
        mkdir -p output
        mkdir -p temp
    
    - name: Run MPV config build
      run: |
        python run.py --log-level INFO
      env:
        # 设置UTF-8编码以支持中文日志
        PYTHONIOENCODING: utf-8
        PYTHONLEGACYWINDOWSSTDIO: utf-8
        # 如果需要访问私有仓库，可以设置GitHub token
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: List output files
      run: |
        echo "Generated files:"
        ls -la output/
      shell: bash
    
    - name: Get current date
      id: date
      run: echo "DATE=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT
      shell: bash
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mpv-package-${{ steps.date.outputs.DATE }}
        path: output/
        retention-days: 30
    
    - name: Create Release (if on release branch)
      if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/master'
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: daily-${{ steps.date.outputs.DATE }}
        name: Daily Build ${{ steps.date.outputs.DATE }}
        body: |
          🎬 自动构建的MPV配置包
          
          📅 构建时间: ${{ steps.date.outputs.DATE }}
          🔧 构建分支: ${{ github.ref_name }}
          📝 提交ID: ${{ github.sha }}
          
          📦 包含内容:
          - MPV播放器 (最新版本)
          - uosc插件 (现代化UI)
          - uosc_danmaku插件 (弹幕支持)
          - 预配置的快捷键和设置
          
          ## 🚀 使用方法
          1. 下载并解压 `mpv-package-*.zip` 文件
          2. 运行 `mpv.exe` 开始使用
          3. 配置文件位于 `portable_config/` 目录
          
          ## ⚙️ 配置说明
          - 快捷键配置: `portable_config/input.conf`
          - 插件配置: `portable_config/script-opts/`
          - 自定义脚本: `portable_config/scripts/`
        files: output/*.zip
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Cleanup
      if: always()
      run: |
        # 清理临时文件
        rm -rf temp/
      shell: bash
