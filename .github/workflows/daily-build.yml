name: Daily MPV Package Build

on:
  schedule:
    # 每天早上8点（UTC）运行，即北京时间下午4点
    - cron: '0 8 * * *'
  # 允许手动触发
  workflow_dispatch:
  # 推送到release分支时也触发
  push:
    branches: [ release, master ]
  pull_request:
    branches: [ release, master ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install 7-Zip
      run: |
        # 安装7-Zip
        choco install 7zip -y
        # 验证安装
        7z --help
        # 或者使用winget
        # winget install --id 7zip.7zip --silent --accept-package-agreements --accept-source-agreements
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create output directory
      run: |
        mkdir -p output
        mkdir -p temp
    
    - name: Run MPV config build
      run: |
        python run.py --log-level INFO
      env:
        # 如果需要访问私有仓库，可以设置GitHub token
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: List output files
      run: |
        echo "Generated files:"
        ls -la output/
      shell: bash
    
    - name: Get current date
      id: date
      run: echo "DATE=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT
      shell: bash
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: mpv-package-${{ steps.date.outputs.DATE }}
        path: output/
        retention-days: 30
    
    - name: Create Release (if on release branch)
      if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/master'
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: daily-${{ steps.date.outputs.DATE }}
        name: Daily Build ${{ steps.date.outputs.DATE }}
        body: |
          自动构建的MPV配置包
          
          构建时间: ${{ steps.date.outputs.DATE }}
          
          包含内容:
          - MPV播放器
          - MPV插件
          
          ## 使用方法
          1. 下载并解压包文件
          2. 直接运行MPV播放器
          3. 享受预配置的播放体验
        files: output/*.zip
        draft: false
        prerelease: false
    
    - name: Cleanup
      if: always()
      run: |
        # 清理临时文件
        rm -rf temp/
      shell: bash
